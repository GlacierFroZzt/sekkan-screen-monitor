name: Compilar APK Android (Sekkan Monitor)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Gradle 8.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Aceptar licencias del SDK de Android
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Descargar Wrapper Oficial y Compilar APK
        run: |
          cd android
          mkdir -p gradle/wrapper
          curl -sLo gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.4.0/gradle/wrapper/gradle-wrapper.jar
          curl -sLo gradlew https://raw.githubusercontent.com/gradle/gradle/v8.4.0/gradlew
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk ../Sekkan-Monitor-Student.apk

      - name: Subir APK a Artefactos de GitHub
        uses: actions/upload-artifact@v4
        with:
          name: Sekkan-Monitor-Student-Android-APK
          path: Sekkan-Monitor-Student.apk
          if-no-files-found: error
          retention-days: 30

      - name: Crear Release Pública con Enlace Directo
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: "Sekkan Monitor Android APK v1.0.0"
          body: "Descarga directa de la aplicación Android para transmitir la pantalla completa a tu profesor."
          files: Sekkan-Monitor-Student.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
